name: Pre-translate site

# Translate your published site once and save it, so visitors never wait for the agent.
# Run from GitHub (works on your phone): Actions → Pre-translate site → Run workflow.
# Saved translations go to the "ponte-translations" branch, folder translations/,
# and are then published to GitHub Pages for the free Static mode.
# Text that is already saved is skipped, so re-running only translates new or edited text.
# It also runs by itself every Monday, so new projects get translated without you
# remembering (a week with no new text makes no AI calls and costs nothing).
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 08:47 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "Translate as a batch (half price, can take a few minutes to hours), translate now (full price, fastest), or only estimate the cost"
        required: false
        default: "batch"
        type: choice
        options: [batch, now, estimate]
      url:
        description: "Site to translate (comma-separate several start pages)"
        required: true
        default: "https://lalityakrishnan.in"
      langs:
        description: "Languages (codes, comma-separated). Leave empty to use the list in ponte.config.json (plus your page language, for text like Hindi poems)."
        required: false
        default: ""
      max_pages:
        description: "Most pages to follow on the site"
        required: false
        default: "30"
      model:
        description: "Translator model"
        required: false
        default: "claude-sonnet-5-5"
        type: choice
        options: [claude-sonnet-5-5, claude-opus-5-5]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ponte-translations
  cancel-in-progress: false

jobs:
  pretranslate:
    runs-on: ubuntu-latest
    # Batches usually finish within minutes; allow up to 6 hours just in case.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check API key
        if: ${{ inputs.mode != 'estimate' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Add ANTHROPIC_API_KEY under Settings → Secrets and variables → Actions, then run again."
            exit 1
          fi

      - name: Translate and save
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PONTE_MODEL: ${{ inputs.model || 'claude-sonnet-5-5' }}
          PONTE_STORE: github
          PONTE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PONTE_GITHUB_REPO: ${{ github.repository }}
          PONTE_GITHUB_BRANCH: ponte-translations
        run: |
          set -o pipefail
          MODE="${{ inputs.mode || 'batch' }}"
          FLAGS=""
          [ "$MODE" = "batch" ] && FLAGS="--batch"
          [ "$MODE" = "estimate" ] && FLAGS="--estimate"
          npm run pretranslate -- --url "${{ inputs.url || 'https://lalityakrishnan.in' }}" --langs "${{ inputs.langs }}" --max-pages "${{ inputs.max_pages || '30' }}" $FLAGS 2>&1 | tee pretranslate.log

      - name: Summary
        if: always()
        run: |
          {
            echo "## Pre-translate"
            echo
            echo "Saved translations: [ponte-translations/translations](https://github.com/${{ github.repository }}/tree/ponte-translations/translations)"
            echo
            echo '```'
            tail -n 60 pretranslate.log 2>/dev/null || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: pretranslate
    # Publish whatever was saved, even if a few texts failed (nothing to publish for an estimate).
    if: ${{ !cancelled() && inputs.mode != 'estimate' }}
    uses: ./.github/workflows/publish.yml
